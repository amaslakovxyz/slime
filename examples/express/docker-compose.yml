services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: slime_admin
      POSTGRES_PASSWORD: slime_admin
      POSTGRES_DB: slime
    ports:
      # Non-default host port so it doesn't clash with a local Postgres.
      - "54329:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # -h 127.0.0.1: the temporary server that runs init.sql listens only on the
      # unix socket, so this passes only once init is done and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U slime_admin -d slime"]
      interval: 2s
      timeout: 3s
      retries: 30
