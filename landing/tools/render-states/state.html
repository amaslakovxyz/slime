<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Offline renders of the three matter states for the landing page cards.
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const state = params.get('s') || 'liquid';
if (params.get('bg')) document.body.style.background = '#161019'; // preview only
const W = 960, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 50);
camera.position.set(0, 0, 7);

const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-2.5, 3, 4);
const rim = new THREE.DirectionalLight(0x38f8b8, 2.0); rim.position.set(3, -1.5, -2.5);
const fill = new THREE.PointLight(0xff85c0, 16, 30, 1.2); fill.position.set(2.5, 1.5, 3);
scene.add(key, rim, fill);

function metaballs(material, balls, scale) {
  const mc = new MarchingCubes(72, material, false, false, 120000);
  mc.isolation = 80;
  mc.reset();
  for (const b of balls) mc.addBall(b[0], b[1], b[2], b[3], 12);
  mc.update();
  mc.scale.setScalar(scale);
  return mc;
}

if (state === 'gas') {
  // Vapor: a loose drift of translucent Cryo Mint bubbles, some barely merging.
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x38f8b8, emissive: 0x0c5c45, emissiveIntensity: 0.25, roughness: 0.25,
    transparent: true, opacity: 0.82, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.8,
  });
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const balls = [];
  for (let i = 0; i < 16; i++) {
    const a = rnd() * Math.PI * 2, r = 0.05 + rnd() * 0.24;
    balls.push([0.5 + Math.cos(a) * r, 0.36 + rnd() * 0.34, 0.5 + Math.sin(a) * r * 0.5, 0.05 + rnd() * 0.22]);
  }
  scene.add(metaballs(mat, balls, 3.1));
} else if (state === 'liquid') {
  // Liquid: the brand slime, a glossy Laser Plasma body.
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xff1476, emissive: 0x8f0043, emissiveIntensity: 0.22, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.04,
    sheen: 0.35, sheenColor: new THREE.Color(0xff85c0), iridescence: 0.25, envMapIntensity: 0.65,
  });
  const balls = [[0.5, 0.5, 0.5, 3.0]];
  const n = 7;
  for (let i = 0; i < n; i++) {
    const th = i * 2.399, ph = Math.acos(1 - (2 * (i + 0.5)) / n), d = 0.15;
    balls.push([0.5 + Math.sin(ph) * Math.cos(th) * d, 0.5 + Math.cos(ph) * d, 0.5 + Math.sin(ph) * Math.sin(th) * d, 0.22 + 0.1 * (i % 3) / 2]);
  }
  balls.push([0.78, 0.6, 0.5, 0.05]);
  scene.add(metaballs(mat, balls, 2.9));
} else {
  // Crystal: hard, faceted Diamond Quartz / Iridescent Ice shards.
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xb9a4ff, emissive: 0x24184d, emissiveIntensity: 0.4, roughness: 0.08, metalness: 0.3,
    clearcoat: 1, clearcoatRoughness: 0.02, iridescence: 0.8, iridescenceIOR: 1.6, flatShading: true, envMapIntensity: 0.9,
  });
  const group = new THREE.Group();
  const main = new THREE.Mesh(new THREE.OctahedronGeometry(1.25, 0), mat);
  main.scale.set(0.85, 1.35, 0.85); group.add(main);
  const shards = [[-1.05, -0.55, 0.2, 0.55, 0.6], [1.0, -0.7, -0.1, 0.5, -0.5], [0.55, 0.95, 0.3, 0.32, 0.9], [-0.6, 0.9, -0.2, 0.28, -0.8]];
  for (const [x, y, z, s, rz] of shards) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mat);
    m.position.set(x, y, z); m.scale.set(s * 0.8, s * 1.5, s * 0.8); m.rotation.set(0.2, 0.4, rz); group.add(m);
  }
  group.rotation.set(0.12, 0.5, 0);
  const glow = new THREE.PointLight(0xc4b5fd, 20, 20, 1.2); glow.position.set(-2, 1, 3); scene.add(glow);
  scene.add(group);
}

renderer.render(scene, camera);
window.__done = true;
</script>
</body>
</html>
