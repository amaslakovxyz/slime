name: Terraform AWS

# CD for every Terraform stack under platform/infra/ except bootstrap.
#
# Trust model (roles defined in platform/infra/bootstrap/github_oidc.tf):
#   validate  no AWS credentials                    every PR / push
#   plan      OIDC -> slime-gha-plan (read-only)    pull requests from this repo
#   apply     OIDC -> slime-gha-apply               push / manual run on main
# The apply role trusts only the `<prefix>:ref:refs/heads/main` subject (the
# repo uses GitHub's immutable `repo:owner@id/name@id` prefix), so PR code can
# never assume it. Do NOT add `environment:` to the apply job: it changes the
# OIDC subject and AWS would reject the token.
# NOTE: GitHub Free private repos have no branch protection, so anyone with
# write access who pushes to main triggers apply. See platform/infra/README.md.
#
# Stacks: every platform/infra/<name>/ except bootstrap (which owns the CI roles and
# is applied by a human). A stack with a build.sh gets it run first, from the
# repo root, so Terraform can zip its artifact (platform builds the runtime and
# the admin).
# Every stack is planned/applied on every run; unchanged stacks are no-ops.
#
# Trigger paths = every input of a deployed artifact: platform/build.sh also
# builds crystal/ and installs from the root package.json/package-lock.json.
# Keep DEPLOY_PATHS in the apply job's "Skip if superseded" step in sync.

on:
  pull_request:
    paths:
      - platform/**
      - core/**
      - crystal/**
      - package.json
      - package-lock.json
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - platform/**
      - core/**
      - crystal/**
      - package.json
      - package-lock.json
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: Let apply delete resources (pure deletes are refused by default)
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  AWS_REGION: eu-central-1
  PLAN_ROLE_ARN: arn:aws:iam::025772230981:role/slime-gha-plan
  APPLY_ROLE_ARN: arn:aws:iam::025772230981:role/slime-gha-apply

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive platform/infra
      - name: Validate stacks (no backend, no credentials)
        run: |
          for dir in platform/infra/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: List deployable stacks
        id: stacks
        run: |
          stacks=$(find platform/infra -mindepth 1 -maxdepth 1 -type d ! -name bootstrap -exec basename {} \; | sort | jq -R . | jq -sc .)
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Stacks: $stacks"

  plan:
    name: Plan (${{ matrix.stack }})
    needs: validate
    # Fork PRs get no OIDC token; skip instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.validate.outputs.stacks) }}
    permissions:
      contents: read
      id-token: write
    # No cancel: an interrupted plan can leave the S3 lockfile behind.
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      STACK_DIR: platform/infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('platform/infra/{0}/build.sh', matrix.stack)) != ''
        with:
          node-version: 22
      # Before credentials on purpose: npm install scripts never see AWS tokens.
      - name: Build artifacts
        if: hashFiles(format('platform/infra/{0}/build.sh', matrix.stack)) != ''
        run: bash "$STACK_DIR/build.sh"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: terraform -chdir="$STACK_DIR" init
      - name: Plan
        run: |
          set +e
          terraform -chdir="$STACK_DIR" plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          {
            echo "## Terraform plan: \`$STACK_DIR\`"
            echo '```'
            # Keep the summary readable; the full plan is in the job log.
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = no changes, 2 = changes present; anything else is a failure.
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]

  apply:
    name: Apply (${{ matrix.stack }})
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.validate.outputs.stacks) }}
    permissions:
      contents: read
      id-token: write
    # Serialize applies per stack and never cancel one mid-flight.
    concurrency:
      group: terraform-apply-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      STACK_DIR: platform/infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('platform/infra/{0}/build.sh', matrix.stack)) != ''
        with:
          node-version: 22
      # Before credentials on purpose: npm install scripts never see AWS tokens.
      - name: Build artifacts
        if: hashFiles(format('platform/infra/{0}/build.sh', matrix.stack)) != ''
        run: bash "$STACK_DIR/build.sh"
      # Browser for the admin cloud smoke below; build.sh already ran npm ci
      # in platform/admin. Also before credentials.
      - name: Install Playwright browser
        if: matrix.stack == 'platform'
        working-directory: platform/admin
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
        run: |
          if [ -z "$SMOKE_EMAIL" ]; then echo "No SMOKE_EMAIL secret; cloud smoke will be skipped."; exit 0; fi
          npx playwright install --with-deps chromium
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: terraform -chdir="$STACK_DIR" init
      - name: Plan
        run: terraform -chdir="$STACK_DIR" plan -lock-timeout=5m -no-color -out=tfplan
      # Concurrency only serializes applies; it does not order them. A re-run of
      # an old run, or an old run whose apply starts after a newer one's, would
      # deploy stale code over newer. Checked here, after this job holds the
      # concurrency slot: if main has since changed a deploy input, the run for
      # that newer commit applies it, so this one stops before touching AWS.
      # A newer commit outside DEPLOY_PATHS (docs, examples) has no run of its
      # own, so this run still applies: its deployed inputs equal main's.
      - name: Skip if superseded
        id: fresh
        run: |
          DEPLOY_PATHS=(platform core crystal package.json package-lock.json .github/workflows/terraform.yml)
          git fetch --no-tags --depth=1 origin main
          main=$(git rev-parse FETCH_HEAD)
          set +e
          git diff --quiet "$GITHUB_SHA" "$main" -- "${DEPLOY_PATHS[@]}"
          code=$?
          set -e
          case "$code" in
            0) echo "current=true" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "::notice::Apply skipped: main is at ${main:0:7}, which changes deploy inputs after ${GITHUB_SHA:0:7}; the run for main deploys them. To redeploy main, use Run workflow, not Re-run."
              echo "current=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$code" ;;
          esac
      # Without branch protection, main can receive a stack that lost resources
      # someone applied by hand from a branch. Replacements are fine; pure
      # deletes need a manual run with allow_destroy.
      - name: Refuse pure deletes
        if: ${{ steps.fresh.outputs.current == 'true' && !inputs.allow_destroy }}
        run: |
          deletes=$(terraform -chdir="$STACK_DIR" show -json tfplan \
            | jq -r '[.resource_changes[]? | select(.change.actions == ["delete"]) | .address] | join(", ")')
          if [ -n "$deletes" ]; then
            echo "::error::Plan deletes: $deletes. Re-run manually with allow_destroy if intended."
            exit 1
          fi
      - name: Apply
        if: steps.fresh.outputs.current == 'true'
        run: terraform -chdir="$STACK_DIR" apply -lock-timeout=5m -no-color tfplan
      - name: Verify convergence
        if: steps.fresh.outputs.current == 'true'
        run: terraform -chdir="$STACK_DIR" plan -lock-timeout=5m -no-color -detailed-exitcode
      # Post-deploy steps keyed on stack outputs, so any stack can opt in.
      - name: Post-deploy
        if: steps.fresh.outputs.current == 'true'
        run: |
          outputs=$(terraform -chdir="$STACK_DIR" output -json)
          # HTTP status of a request, retried while a fresh distribution, DNS
          # record or cold function is still settling: expect <want> <curl args...>.
          expect() {
            local want=$1 code
            shift
            for _ in $(seq 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@" || true)
              [ "$code" = "$want" ] && break
              sleep 15
            done
            echo "$* -> $code (want $want)"
            [ "$code" = "$want" ]
          }
          dist=$(jq -r '.cloudfront_distribution_id.value // empty' <<<"$outputs")
          if [ -n "$dist" ]; then
            aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' --query Invalidation.Id --output text
          fi
          url=$(jq -r '.runtime_url.value // empty' <<<"$outputs")
          if [ -n "$url" ]; then
            # The function answers 401 outside /ep/<id>/ (no key is possible there).
            expect 401 "${url%/}/healthz"
            # A well-formed id with no settings in SSM.
            expect 404 "${url%/}/ep/ep-0000000000/healthz"
          fi
          admin=$(jq -r '.admin_url.value // empty' <<<"$outputs")
          if [ -n "$admin" ]; then
            expect 200 "${admin}login"
            # A server action through CloudFront: neither the origin-header check
            # (403) nor Next's origin check or the function (5xx) may refuse it.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST --data '' "${admin}login")
            echo "POST ${admin}login -> $code"
            case "$code" in 403 | 5* | 000) exit 1 ;; esac
            # The landing (apex of the admin's domain, landing stack) links here.
            host=${admin#https://}
            landing="https://${host#*.}"
            for _ in $(seq 10); do
              curl -s --max-time 30 "$landing" | grep -qF "href=\"$admin\"" && found=1 && break
              sleep 15
            done
            echo "landing $landing links to $admin: ${found:-no}"
            [ -n "${found:-}" ]
            aws s3api head-bucket --bucket "$(jq -r '.crystals_bucket.value' <<<"$outputs")"
            for table in $(jq -r '.control_table.value, .handlers_table.value' <<<"$outputs"); do
              aws dynamodb describe-table --table-name "$table" --query Table.TableStatus --output text
            done
          fi
      # Goal 10 of docs/architecture/2026-11-21-cloud-mvp-design.md: sign-in,
      # create -> failed (no cloud database), keyless 401, unknown id 404,
      # delete. Runs without the AWS credentials: it only talks HTTPS.
      - name: Admin cloud smoke
        if: steps.fresh.outputs.current == 'true' && matrix.stack == 'platform'
        working-directory: platform/admin
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::notice::Admin cloud smoke skipped: set the SMOKE_EMAIL and SMOKE_PASSWORD secrets (an allowlisted user)."
            exit 0
          fi
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN npm run e2e:cloud
