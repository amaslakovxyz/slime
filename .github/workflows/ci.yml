name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  sandbox:
    name: Sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slime_admin
          POSTGRES_PASSWORD: slime_admin
          POSTGRES_DB: slime
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slime_admin -d slime"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      # Same schema, seed data and database users as `npm run db:up` locally.
      - run: psql "postgres://slime_admin:slime_admin@localhost:54329/slime" -v ON_ERROR_STOP=1 -f db/init.sql
      - run: npm ci
      - run: npm run typecheck
      # REQUIRE_DB makes database tests fail instead of skipping if Postgres is missing.
      - run: npm test
        env:
          REQUIRE_DB: "1"
      # The Lambda bundle deployed by terraform.yml (infra/aws/platform).
      - run: npm run build:lambda

  landing:
    name: Landing function tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The landing stack (infra/aws/landing) arrives with its own PR; no-op until then.
      - uses: actions/setup-node@v4
        if: hashFiles('infra/aws/landing/function/index.test.mjs') != ''
        with:
          node-version: 22
      - if: hashFiles('infra/aws/landing/function/index.test.mjs') != ''
        run: node --test infra/aws/landing/function/
