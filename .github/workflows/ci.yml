name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  sandbox:
    name: Sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slime_admin
          POSTGRES_PASSWORD: slime_admin
          POSTGRES_DB: slime
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slime_admin -d slime"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      # Same schema, seed data and database users as `npm run db:up` locally.
      - run: psql "postgres://slime_admin:slime_admin@localhost:54329/slime" -v ON_ERROR_STOP=1 -f db/init.sql
      - run: npm ci
      - run: npm run typecheck
      # REQUIRE_DB makes database tests fail instead of skipping if Postgres is missing.
      - run: npm test
        env:
          REQUIRE_DB: "1"
