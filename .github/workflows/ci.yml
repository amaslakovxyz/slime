name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  sandbox:
    name: Sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slime_admin
          POSTGRES_PASSWORD: slime_admin
          POSTGRES_DB: slime
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slime_admin -d slime"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      # Same schema, seed data and database users as `npm run db:up` locally.
      - run: psql "postgres://slime_admin:slime_admin@localhost:54329/slime" -v ON_ERROR_STOP=1 -f db/init.sql
      - run: npm ci
      - run: npm run typecheck
      # REQUIRE_DB makes database tests fail instead of skipping if Postgres is missing.
      - run: npm test
        env:
          REQUIRE_DB: "1"

  runtime:
    name: Slime Cloud runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: slime-cloud/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sandbox/package-lock.json
            slime-cloud/runtime/package-lock.json
      # Boundary: the open-source core never depends on Slime Cloud or AWS.
      - name: Core does not import the platform
        working-directory: .
        run: "! grep -rnE \"slime-cloud|@aws-sdk/\" sandbox/src"
      # The runtime compiles @slime-cloud/core from sandbox/src, whose imports
      # resolve against sandbox/node_modules.
      - run: npm ci
        working-directory: sandbox
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Lambda bundle deployed by terraform.yml (infra/aws/platform).
      - run: npm run build

  provisioner:
    name: Slime Cloud provisioner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: slime-cloud/provisioner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slime-cloud/provisioner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Fake AWS clients only; no credentials.
      - run: npm test
      # The Lambda bundle deployed by terraform.yml (infra/aws/platform).
      - run: npm run build

  admin:
    name: Slime Cloud admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: slime-cloud/admin
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      AWS_REGION: eu-central-1
      AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slime-cloud/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # REQUIRE_DYNAMO makes the DynamoDB Local tests fail instead of skipping.
      - run: npm test
        env:
          REQUIRE_DYNAMO: "1"
      - run: npm run build

  landing:
    name: Landing function tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test infra/aws/landing/function/index.test.mjs
