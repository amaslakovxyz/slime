name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The demo database from examples/express/db/init.sql, for the Postgres connector tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slime_admin
          POSTGRES_PASSWORD: slime_admin
          POSTGRES_DB: slime
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slime_admin -d slime"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Boundary: the open-source core never imports Slime Cloud packages or AWS.
      - name: Core does not import Slime Cloud or AWS
        run: "! grep -rnE \"@slime-cloud/(runtime|server|control-plane)|platform/runtime|@aws-sdk/\" core/src"
      - run: npm ci
      - run: psql "postgres://slime_admin:slime_admin@localhost:54329/slime" -v ON_ERROR_STOP=1 -f examples/express/db/init.sql
      - run: npm run typecheck -w @slime-cloud/core
      # REQUIRE_DB makes database tests fail instead of skipping if Postgres is missing.
      - run: npm test -w @slime-cloud/core
        env:
          REQUIRE_DB: "1"
      # What would be published: compiled dist/ with types, no sources or tests.
      - run: npm run build -w @slime-cloud/core
      - run: npm run check:pack -w @slime-cloud/core

  example:
    name: Example app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slime_admin
          POSTGRES_PASSWORD: slime_admin
          POSTGRES_DB: slime
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U slime_admin -d slime"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/express/package-lock.json
      - run: psql "postgres://slime_admin:slime_admin@localhost:54329/slime" -v ON_ERROR_STOP=1 -f examples/express/db/init.sql
      # The example runs on the packed tarball, as an app installing the package would (M6).
      - run: npm ci
      - run: npm pack -w @slime-cloud/core --pack-destination "$RUNNER_TEMP"
      - run: npm ci
        working-directory: examples/express
      - run: npm install --no-save "$RUNNER_TEMP"/slime-cloud-core-*.tgz
        working-directory: examples/express
      - run: npm test
        working-directory: examples/express
        env:
          REQUIRE_DB: "1"
      - run: npm run check:crystal
        working-directory: examples/express

  runtime:
    name: Slime Cloud runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/runtime/package-lock.json
      # The runtime links @slime-cloud/core (core/) and bundles its
      # built dist/; the core's own dependencies come from the root workspace.
      - run: npm ci
        working-directory: .
      - run: npm run build -w @slime-cloud/core
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Lambda bundle deployed by terraform.yml (platform/infra/platform).
      - run: npm run build

  landing:
    name: Landing function tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test platform/infra/landing/function/index.test.mjs
